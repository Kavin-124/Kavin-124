name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stats SVG
        run: |
          curl -s "https://github-readme-stats-fast.vercel.app/api?username=Kavin-124&show_icons=true&theme=tokyonight&hide_border=true&count_private=true" -o github-stats.svg

      - name: Commit & Push Stats Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git commit -m "Update self-hosted github stats image" || exit 0
          git push
